<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AA 촬영 준비 원호 시안</title>
<!--
  촬영 준비 1~6단계 시안 (Claude, 2026-10-02). Codex 원호 시안(aa-prepare-edge-arcs-codex.html)의 스타일을 따른다.
  - "촬영을 준비합니다" 원이 커지며 왼쪽 가장자리의 원호 조각 6개가 된다 (항성계 비유: "준비" 행성의 궤도와 위성 6개)
  - 가운데: 지금 단계의 실시간 화면 + 목표 숫자 하나. 오른쪽: 할 일 한 줄 · 설명 · 버튼
  - 단계 끝은 모두 사용자가 누른다. 끝내는 버튼이 다음 단계를 시작한다 (DESIGN.md "촬영 준비")
  - 모의 시안: 장비는 움직이지 않는다. 시간은 짧게 줄였다
-->
<style>
:root {
  --page-bg: #17181a; --page-surface: #202124; --page-text: #e8e5df; --page-muted: #9d9a94; --page-line: #34363a; --page-accent: #f0a93b;
  --font: 'Pretendard Variable', Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--page-text); font-family: var(--font); font-size: 15px; line-height: 1.6; word-break: keep-all; }
.page { max-width: 1760px; margin: 0 auto; padding: 24px 20px 56px; display: grid; gap: 16px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 800; }
.top p { margin: 4px 0 0; color: var(--page-muted); font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.controls .lbl { font-size: 13px; color: var(--page-muted); margin-left: 8px; }
.ctl { padding: 5px 12px; border: 1px solid var(--page-line); border-radius: 8px; background: var(--page-surface); color: var(--page-text); font: inherit; font-size: 13px; cursor: pointer; }
.ctl[aria-pressed="true"] { border-color: var(--page-accent); color: var(--page-accent); font-weight: 700; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid var(--page-line); border-radius: 12px; }

/* ───────── 앱 (1920×1200 기준, 폭에 맞춰 축소) ───────── */
.app { position: absolute; left: 0; top: 0; width: 1920px; height: 1200px; transform-origin: 0 0; transform: scale(var(--s, 1));
  display: flex; flex-direction: column; font-family: var(--font); font-size: 15.5px; line-height: 1.6; color: var(--text); background: var(--bg); overflow: hidden;
  --radius: 10px; --gutter: 96px; }
.app, .app[data-t="dark"] { --bg:#1e1f21; --surface:#27292c; --surface-2:#303236; --line:#3b3e42; --text:#ebe8e3; --muted:#a3a09a; --accent:#f0a93b; --pass:#72bf8e; --fail:#f07a52; --warn:#f0a93b; --step-idle:#242528; --step-done:#303337; --step-done-line:#5e8f6f; --primary-bg:#f0a93b; --primary-border:#f0a93b; --primary-text:#231800; --glow: rgb(240 169 59 / .55); }
.app[data-t="light"] { --bg:#f1f1ef; --surface:#fafaf9; --surface-2:#e7e7e4; --line:#d6d6d2; --text:#25272a; --muted:#676a6e; --accent:#b36b00; --pass:#2f7d4e; --fail:#c24a26; --warn:#a06200; --step-idle:#e7e7e4; --step-done:#fff; --step-done-line:#8fb89d; --primary-bg:#b36b00; --primary-border:#b36b00; --primary-text:#fff; --glow: rgb(179 107 0 / .4); }
.app[data-t="night"] { --bg:#000; --surface:#0c0000; --surface-2:#170000; --line:#3c0000; --text:#b80000; --muted:#720000; --accent:#d00000; --pass:#b80000; --fail:#b80000; --warn:#b80000; --step-idle:#060000; --step-done:#150000; --step-done-line:#6a0000; --primary-bg:#260000; --primary-border:#8a0000; --primary-text:#d00000; --glow: rgb(208 0 0 / .4); }
.app svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 상태 줄 */
.bar { flex: 0 0 44px; display: flex; align-items: center; gap: 20px; padding: 0 var(--gutter); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; position: relative; z-index: 5; background: var(--bg); }
.bar .brand { font-weight: 800; letter-spacing: .04em; color: var(--text); }
.bar .ver { margin-left: -12px; font-size: 11px; }
.bar .prof { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; }
.bar .ava { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); }
.bar .devs { display: flex; gap: 14px; flex: 1; }
.bar .dev { display: inline-flex; align-items: center; gap: 6px; }
.bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); }
.bar .dev[data-busy="1"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.bar .site { color: var(--text); } .bar .site b { font-weight: 600; margin-right: 6px; }
.bar .clock { color: var(--text); }

/* 단계 레일 */
.rail { flex: 0 0 38px; position: relative; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); background: var(--bg); }
.rail .rs { display: inline-flex; align-items: center; gap: 6px; }
.rail .mk { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
.rail .rs[data-s="done"] { color: var(--text); } .rail .rs[data-s="done"] .mk { box-shadow: none; color: var(--pass); font-size: 14px; }
.rail .rs[data-s="now"] { color: var(--text); font-weight: 700; } .rail .rs[data-s="now"] .mk { box-shadow: inset 0 0 0 1.5px var(--accent); }
.rail .rs[data-s="now"] .mk::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.rail .sep { width: 28px; height: 2px; border-radius: 1px; background: var(--line); } .rail .sep[data-on="1"] { background: var(--accent); }
.railEnd { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
.railEnd span { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.railEnd .abort { box-shadow: inset 0 0 0 1px var(--line); color: var(--text); font-weight: 600; }

/* ── 무대 ── */
.stage { position: relative; flex: 1; overflow: hidden; background: var(--bg); transition: background 1200ms; }
.app[data-edge="open"] .stage { background: color-mix(in srgb, var(--bg) 96%, var(--text) 4%); }
.edgeCanvas { position: absolute; inset: 0; width: 1920px; height: 1118px; pointer-events: none; }
.edgeShape { transform: translate(960px, 559px) scale(.065); transition: transform 1600ms cubic-bezier(.65, 0, .2, 1); }
.app[data-edge="open"] .edgeShape { transform: translate(-2870px, 559px) scale(1); }
.fullOrbit { fill: var(--bg); stroke: var(--accent); stroke-width: 22; transition: stroke 1200ms, stroke-width 1200ms; }
.app[data-edge="open"] .fullOrbit { stroke: color-mix(in srgb, var(--accent) 28%, var(--line)); stroke-width: 2; }
.seg { fill: none; stroke: var(--line); stroke-width: 24; stroke-linecap: round; opacity: 0; transition: opacity 700ms 500ms, stroke 400ms, filter 400ms; }
.app[data-edge="open"] .seg { opacity: .6; }
.app[data-edge="open"] .seg[data-s="done"] { stroke: var(--step-done-line); opacity: 1; }
.app[data-edge="open"] .seg[data-s="now"] { stroke: var(--accent); opacity: 1; filter: drop-shadow(0 0 7px var(--glow)); }
.app[data-edge="open"] .seg[data-s="fail"] { stroke: var(--fail); opacity: 1; }
.introWords { position: absolute; left: 0; right: 0; top: 530px; text-align: center; font-size: 30px; font-weight: 600; transition: opacity 300ms; }
.app[data-edge="open"] .introWords { opacity: 0; }

/* 지금 단계 이름: 지금 조각 바로 옆, 조각을 따라 내려간다 */
.stepName { position: absolute; left: 372px; display: grid; gap: 2px; opacity: 0; transition: top 600ms cubic-bezier(.55, 0, .2, 1), opacity 400ms; }
.app[data-ready="1"] .stepName { opacity: 1; }
.stepName b { font-size: 26px; font-weight: 700; line-height: 1.2; }
.stepName span { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 끝난 조각을 가리키면: 이름 · 결과 한 줄 */
.segHit { position: absolute; width: 56px; height: 120px; transform: translate(-50%, -50%); cursor: default; }
.segTip { position: absolute; transform: translateY(-50%); padding: 6px 12px; border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity 160ms; pointer-events: none; }
.segTip small { color: var(--muted); margin-left: 8px; }
.segTip[data-on="1"] { opacity: 1; }

/* 가운데: 실시간 화면 */
.live { position: absolute; left: 560px; top: 559px; width: 560px; height: 560px; transform: translateY(-50%); display: grid; grid-template-rows: auto 1fr; gap: 14px; opacity: 0; transition: opacity 400ms; }
.app[data-ready="1"] .live { opacity: 1; }
.liveHead { display: flex; align-items: baseline; justify-content: space-between; min-height: 64px; }
.liveHead .num { font-size: 52px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.liveHead .num small { font-size: 20px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.liveHead .cap { font-size: 15px; color: var(--muted); text-align: right; }
.liveBody { position: relative; border-radius: 14px; background: var(--surface); overflow: hidden; }
.liveBody svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.liveBody .txtFill { fill: var(--text); } .liveBody .mutedFill { fill: var(--muted); }
.liveBody .grid { stroke: var(--line); stroke-width: 1; fill: none; }
.liveBody .acc { stroke: var(--accent); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.liveBody .sub2 { stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.liveBody .accFill { fill: var(--accent); }
.liveBody .star { fill: var(--text); }
.liveBody text { font-family: var(--font); font-size: 15px; fill: var(--muted); }
.readout { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 22px; }
.readout .big { font-size: 96px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
.readout .rows { display: grid; gap: 10px; font-size: 18px; }
.readout .rows div { display: flex; gap: 14px; justify-content: space-between; min-width: 300px; }
.readout .rows span { color: var(--muted); }
.readout .rows b { font-weight: 600; }
.readout .rows b[data-k="busy"] { color: var(--accent); } .readout .rows b[data-k="ok"] { color: var(--pass); } .readout .rows b[data-k="fail"] { color: var(--fail); }

/* 오른쪽: 할 일 */
.panel { position: absolute; left: 1200px; top: 559px; width: 620px; transform: translateY(-50%); display: grid; gap: 22px; justify-items: start; opacity: 0; transition: opacity 300ms; }
.app[data-ready="1"] .panel { opacity: 1; }
.panel[data-swap="1"] { opacity: 0 !important; }
.kicker { font-size: 18px; font-weight: 700; color: var(--accent); min-height: 29px; font-variant-numeric: tabular-nums; }
.panel h2 { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.35; text-wrap: balance; }
.panel p { margin: 0; font-size: 21px; color: var(--muted); line-height: 1.75; min-height: calc(2 * 1.75em); }
.status { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; min-height: 34px; }
.status[data-k="ok"] { color: var(--pass); } .status[data-k="fail"] { color: var(--fail); } .status[data-k="warn"] { color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; min-height: 64px; }
.primary { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 240px; height: 64px; padding: 0 30px; border: 1.5px solid var(--primary-border); border-radius: 14px; background: var(--primary-bg); color: var(--primary-text); font: inherit; font-size: 21px; font-weight: 800; cursor: pointer; }
.quiet { height: 64px; padding: 0 24px; border: 1.5px solid var(--line); border-radius: 14px; background: transparent; color: var(--text); font: inherit; font-size: 18px; font-weight: 600; cursor: pointer; }
.app button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.mini { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes jitter { 0%,100% { transform: translate(0,0); } 25% { transform: translate(1.2px,-.8px); } 50% { transform: translate(-.8px,.6px); } 75% { transform: translate(.6px,1px); } }
@media (prefers-reduced-motion: reduce) { .edgeShape, .seg, .stepName, .live, .panel { transition-duration: 1ms !important; transition-delay: 0ms !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>촬영 준비 · 원호 시안 (1~6단계)</h1>
    <p>Codex 원호 시안의 스타일을 따른 전체 흐름 시안입니다. 단계 끝은 모두 버튼으로 넘어가고, 그 버튼이 다음 단계를 시작합니다. 장비는 움직이지 않으며 시간은 줄였습니다.</p>
  </header>
  <div class="controls">
    <button class="ctl" id="replay" type="button">처음부터</button>
    <span class="lbl">단계로 바로</span>
    <span id="jump"></span>
    <span class="lbl">경우</span>
    <button class="ctl" id="failT" type="button" aria-pressed="false">다음 동작 실패</button>
    <button class="ctl" id="lowT" type="button" aria-pressed="false">대상이 아직 낮음</button>
    <span class="lbl">테마</span>
    <button class="ctl" data-t="dark" type="button" aria-pressed="true">어둡게</button>
    <button class="ctl" data-t="light" type="button" aria-pressed="false">밝게</button>
    <button class="ctl" data-t="night" type="button" aria-pressed="false">촬영</button>
  </div>

  <div class="frame"><div class="app" id="app" data-edge="intro" data-ready="0">
    <div class="bar"><span class="brand">AA</span><span class="ver">v0.0.31</span><span class="prof"><span class="ava"></span>별보는사람</span>
      <span class="devs"><span class="dev"><span class="dot"></span>WandererBox</span><span class="dev"><span class="dot"></span>OnStep</span><span class="dev"><span class="dot"></span>Pleiades68</span><span class="dev"><span class="dot"></span>X-T5</span><span class="dev"><span class="dot"></span>Oasis Focuser</span><span class="dev" id="phd2Dev"><span class="dot"></span><span id="phd2Txt">PHD2</span></span></span>
      <span class="site"><b>안반데기 주차장</b>위도 37.62° · 경도 128.74°</span><time class="clock">21:48</time></div>

    <div class="stage" id="stage">
      <svg class="edgeCanvas" viewBox="0 0 1920 1118" aria-hidden="true"><g class="edgeShape">
        <circle class="fullOrbit" cx="0" cy="0" r="3178"/>
        <path class="seg" d="M 3174.627 -402.175 A 3200 3200 0 0 1 3186.422 -294.474"/>
        <path class="seg" d="M 3189.148 -263.316 A 3200 3200 0 0 1 3196.234 -155.204"/>
        <path class="seg" d="M 3197.598 -123.957 A 3200 3200 0 0 1 3199.962 -15.638"/>
        <path class="seg" d="M 3199.962 15.638 A 3200 3200 0 0 1 3197.598 123.957"/>
        <path class="seg" d="M 3196.234 155.204 A 3200 3200 0 0 1 3189.148 263.316"/>
        <path class="seg" d="M 3186.422 294.474 A 3200 3200 0 0 1 3174.627 402.175"/>
      </g></svg>
      <div class="introWords">촬영을 준비합니다</div>
      <div id="hits"></div><div class="segTip" id="segTip"></div>
      <div class="stepName" id="stepName"><b id="stepNameB"></b><span id="stepNameN"></span></div>

      <section class="live" aria-live="polite">
        <div class="liveHead"><span class="num" id="num"></span><span class="cap" id="cap"></span></div>
        <div class="liveBody" id="liveBody"></div>
      </section>

      <section class="panel" id="panel" aria-live="polite">
        <span class="kicker" id="kicker"></span>
        <h2 id="title"></h2>
        <p id="desc"></p>
        <span class="status" id="status"></span>
        <div class="row" id="row"></div>
      </section>
    </div>

    <nav class="rail" id="rail"></nav>
  </div></div>
</div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var $ = function (id) { return document.getElementById(id); };
  var CHECK = '<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M20 6 9 17l-5-5"/></svg>';
  var WARN = '<svg class="i" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>';
  var X = '<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  var STEPS = ['극축 정렬', '대상 이동', '초점', '센터링', '가이딩', '시험 사진'];
  var TARGET = 'M31 안드로메다';
  var EXPOSURE = 120;
  // 원호 조각 가운데의 화면 좌표 (edgeShape: 중심 (-2870, 559), 반지름 3200)
  var SEG_Y = [-348.3, -209.3, -69.8, 69.8, 209.3, 348.3];
  var segMid = SEG_Y.map(function (dy) { return { x: -2870 + Math.sqrt(3200 * 3200 - dy * dy), y: 559 + dy }; });
  var segs = Array.prototype.slice.call(document.querySelectorAll('.seg'));

  // ── 상태 ──
  var cur = 0;             // 지금 단계 (0~5)
  var segState = ['idle', 'idle', 'idle', 'idle', 'idle', 'idle'];
  var results = ['', '', '', '', '', ''];
  var timers = [], ivals = [];
  var failNext = false, targetLow = false;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function every(fn, ms) { var h = setInterval(fn, ms); ivals.push(h); return h; }
  function clearAll() { timers.forEach(clearTimeout); ivals.forEach(clearInterval); timers = []; ivals = []; }
  function takeFail() { if (!failNext) return false; failNext = false; $('failT').setAttribute('aria-pressed', 'false'); return true; }

  // ── 그리기 도우미 ──
  function paintSegs() {
    segs.forEach(function (p, i) { p.dataset.s = segState[i]; });
    var m = segMid[cur];
    $('stepName').style.top = (m.y - 34) + 'px';
    $('stepNameB').textContent = STEPS[cur];
    $('stepNameN').textContent = (cur + 1) + ' / 6';
  }
  function setPanel(o) {
    var panel = $('panel');
    panel.dataset.swap = '1';
    later(function () {
      $('kicker').textContent = o.kicker || '';
      $('title').textContent = o.title || '';
      $('desc').textContent = o.desc || '';
      status(o.status);
      buttons(o.buttons || []);
      panel.dataset.swap = '0';
    }, o.instant ? 0 : 180);
  }
  function status(s) {
    var el = $('status');
    if (!s) { el.innerHTML = ''; el.dataset.k = ''; return; }
    el.dataset.k = s.k || '';
    var icon = s.k === 'busy' ? '<span class="mini"></span>' : s.k === 'ok' ? CHECK : s.k === 'fail' ? X : s.k === 'warn' ? WARN : '';
    el.innerHTML = icon + '<span>' + s.t + '</span>';
  }
  function buttons(list) {
    var row = $('row'); row.innerHTML = '';
    list.forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button'; el.className = b.primary ? 'primary' : 'quiet'; el.textContent = b.label;
      el.onclick = function () { b.onClick(); };
      row.appendChild(el);
    });
  }
  function head(num, unit, cap) {
    $('num').innerHTML = num === null ? '' : num + (unit ? '<small>' + unit + '</small>' : '');
    $('cap').textContent = cap || '';
  }
  function body(html) { $('liveBody').innerHTML = html; }
  function phd2(busy, txt) { $('phd2Dev').dataset.busy = busy ? '1' : '0'; $('phd2Txt').textContent = txt; }
  function finishStep(result) { segState[cur] = 'done'; results[cur] = result; paintSegs(); }
  function goto(n) { clearAll(); cur = n; for (var i = 0; i < 6; i++) segState[i] = i < n ? 'done' : i === n ? 'now' : 'idle'; paintSegs(); RUN[n](); }
  function next() { goto(cur + 1); }
  // 단계 끝: 결과를 보여 주고, 다음 단계를 시작하는 버튼 하나 (+ 보조 버튼)
  function endStep(o) {
    finishStep(o.result);
    setPanel({ kicker: o.kicker, title: o.title, desc: o.desc, status: { k: 'ok', t: o.ok }, buttons: [{ label: o.nextLabel, primary: true, onClick: o.onNext || next }].concat(o.more || []) });
  }

  // 별밭 (시드 고정)

      function line(arr, cls) { if (arr.length < 2) return ''; var d = ''; var st = Math.max(0, arr.length - n); for (var i = st; i < arr.length; i++) d += (i === st ? 'M' : 'L') + (gx0 + (gx1 - gx0) * (i - st) / (n - 1)).toFixed(1) + ',' + (gy - arr[i] * gh / 2 / 2.4).toFixed(1); return '<path class="' + cls + '" d="' + d + '"/>'; }

      s += '<text x="' + gx0 + '" y="' + (gy + gh / 2 + 34) + '">— 적경</text><text x="' + (gx0 + 90) + '" y="' + (gy + gh / 2 + 34) + '">— 적위</text><text x="' + gx1 + '" y="' + (gy - gh / 2 - 8) + '" text-anchor="end">±2.4″ (주 카메라 한 픽셀)</text>';
      body(s + '</svg>');
    }
    function rms(a) { if (!a.length) return 0; var s = 0; a.forEach(function (v) { s += v * v; }); return Math.sqrt(s / a.length); }
    head(null, '', '가이딩 오차 (전체)');
    setPanel({ kicker: '1 / 4 · 별 선택', title: '가이딩을 시작합니다', desc: '가이드 별을 따라 적도의를 미세하게 보정합니다. 안정되면 오차를 재어 보여 드립니다.', status: { k: 'busy', t: PHASES[0] } });
    view();
    every(function () {
      tick++;
      if (tick === 6) {
        if (fail) {
          clearAll();
          setPanel({ kicker: '1 / 4 · 별 선택', title: '가이드 별을 찾지 못했습니다', desc: '가이드 카메라에 별이 보이지 않습니다. 가이드 망원경 덮개나 초점을 확인한 뒤 다시 시도해 주세요.',
            status: { k: 'fail', t: '별 없음' }, buttons: [{ label: '다시 시도', primary: true, onClick: function () { goto(4); } }, { label: 'PHD2 화면 열기', onClick: function () {} }] });
          return;
        }
        star = true; phase = 1; $('kicker').textContent = '2 / 4 · 캘리브레이션'; status({ k: 'busy', t: PHASES[1] });
      }
      if (tick === 22) { phase = 2; $('kicker').textContent = '3 / 4 · 안정화'; status({ k: 'busy', t: PHASES[2] }); }
      if (tick === 32) { phase = 3; $('kicker').textContent = '4 / 4 · 측정'; status({ k: 'busy', t: PHASES[3] }); }
      if (phase >= 2) {
        var amp = phase === 2 ? 1.6 - (tick - 22) * .1 : .75;
        ra.push((r() - .5) * 2 * amp); de.push((r() - .5) * 2 * amp * .8);
        if (phase === 3) head(Math.sqrt(rms(ra) * rms(ra) + rms(de) * rms(de)).toFixed(1), '″', '가이딩 오차 (전체) · 기준 2.4″');
      }
      view();
      if (tick === 60) {
        clearAll();
        var mra = ra.slice(-28), mde = de.slice(-28); // 측정 구간만 (그래프는 그대로)
        var tot = Math.sqrt(rms(mra) * rms(mra) + rms(mde) * rms(mde));
        head(tot.toFixed(1), '″', '가이딩 오차 (전체) · 기준 2.4″');
        setPanel({ kicker: '4 / 4 · 판정', title: '충분해요', desc: '가이딩 오차 ' + tot.toFixed(1) + '″로 주 카메라 한 픽셀(2.4″)보다 작습니다. 사진에서 흔들림이 거의 보이지 않을 수준이에요.',
          status: { k: 'ok', t: '적경 ' + rms(mra).toFixed(1) + '″ · 적위 ' + rms(mde).toFixed(1) + '″ · 별 잃음 없음' },
          buttons: [{ label: '시험 사진 찍기', primary: true, onClick: function () { finishStep(tot.toFixed(1) + '″ · 충분'); next(); } }, { label: '다시 재기', onClick: function () { goto(4); } }] });
      }
    }, 160);
  };

  // ───────── ⑥ 시험 사진 → "촬영 시작" ─────────
  RUN[5] = function () {
    var fail = takeFail();
    var W = 560, H = 496, left = EXPOSURE;
    head(left, '초', '남은 노출');
    body('<svg viewBox="0 0 ' + W + ' ' + H + '"><text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle">노출 중</text></svg>');
    setPanel({ kicker: '120초 · ISO 800', title: '시험 사진을 찍고 있습니다', desc: '계획한 노출 그대로 한 장 찍어 초점·추적·구도를 확인합니다.', status: { k: 'busy', t: '노출 중입니다' } });
    every(function () {
      if (left <= 0) return;
      left = Math.max(0, left - 8);
      head(left, '초', '남은 노출 (시안은 15배 빠르게)');
      if (left === 0) {
        clearAll();
        if (fail) {
          setPanel({ kicker: '120초 · ISO 800', title: '사진을 받지 못했습니다', desc: '카메라에서 사진을 내려받지 못했습니다. 카메라 연결을 확인한 뒤 다시 찍어 주세요.', status: { k: 'fail', t: '시험 사진을 찍지 못했습니다' },
            buttons: [{ label: '다시 찍기', primary: true, onClick: function () { goto(5); } }] });
          return;
        }
        body('<svg viewBox="0 0 ' + W + ' ' + H + '">' + starfield(W, H, 420, 99, 1.15) + galaxy(W / 2 + 4, H / 2 - 2, 1.6) + '</svg>');
        head('312', '개', '별 수 · 별 크기 HFR 2.3');
        setPanel({ kicker: '120초 · ISO 800', title: '시험 사진을 확인해 주세요', desc: '별이 둥글고 대상이 가운데에 있으면 촬영을 시작하세요. 끝나는 시각은 04:58입니다.', status: { k: 'ok', t: '별 312개 · 별 크기 HFR 2.3' },
          buttons: [{ label: '촬영 시작', primary: true, onClick: function () { finishStep('별 312개 · HFR 2.3'); setPanel({ kicker: '', title: '촬영을 시작합니다', desc: '(시안 끝) 다음 화면은 촬영 단계입니다.', status: { k: 'ok', t: '준비를 마쳤습니다' }, buttons: [{ label: '처음부터 다시 보기', primary: true, onClick: reset }] }); } },
            { label: '다시 찍기', onClick: function () { goto(5); } }, { label: '다시 센터링', onClick: function () { segState[4] = 'idle'; goto(3); } }] });
      }
    }, 70);
  };

  // ── 끝난 조각을 가리키면 이름 · 결과 ──
  $('hits').innerHTML = segMid.map(function (m, i) { return '<span class="segHit" data-i="' + i + '" style="left:' + m.x + 'px;top:' + m.y + 'px"></span>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.segHit'), function (h) {
    h.addEventListener('mouseenter', function () {
      var i = +h.dataset.i; if (segState[i] !== 'done') return;
      var tip = $('segTip'); tip.innerHTML = STEPS[i] + '<small>' + results[i] + '</small>';
      tip.style.left = (segMid[i].x + 40) + 'px'; tip.style.top = segMid[i].y + 'px'; tip.dataset.on = '1';
    });
    h.addEventListener('mouseleave', function () { $('segTip').dataset.on = '0'; });
  });

  // ── 시작 ──
  function reset() {
    clearAll(); cur = 0; segState = ['now', 'idle', 'idle', 'idle', 'idle', 'idle']; results = ['', '', '', '', '', ''];
    phd2(false, 'PHD2'); app.dataset.edge = 'intro'; app.dataset.ready = '0'; paintSegs();
    later(function () { app.dataset.edge = 'open'; }, 1100);
    later(function () { app.dataset.ready = '1'; RUN[0](); }, 2700);
  }
  $('replay').onclick = reset;
  $('jump').innerHTML = STEPS.map(function (s, i) { return '<button class="ctl" type="button" data-j="' + i + '">' + (i + 1) + ' ' + s + '</button>'; }).join(' ');
  Array.prototype.forEach.call(document.querySelectorAll('[data-j]'), function (b) {
    b.onclick = function () { app.dataset.edge = 'open'; app.dataset.ready = '1'; phd2(false, 'PHD2'); var n = +b.dataset.j; for (var i = 0; i < n; i++) results[i] = results[i] || ['사용자 확인 · 12분', '고도 42° · 방위 64°', 'HFR 2.1 · 위치 12,340', '오차 0.4′ · 카메라 방향 87°', '0.9″ · 충분'][i]; goto(n); };
  });
  $('failT').onclick = function () { failNext = !failNext; this.setAttribute('aria-pressed', String(failNext)); };
  $('lowT').onclick = function () { targetLow = !targetLow; this.setAttribute('aria-pressed', String(targetLow)); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (b) {
    b.onclick = function () { app.dataset.t = b.dataset.t; Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); }); };
  });

  var stg = ['연결', '점검', '계획', '준비', '촬영', '마무리'];
  $('rail').innerHTML = stg.map(function (s, i) {
    var k = i < 3 ? 'done' : i === 3 ? 'now' : 'todo';
    return (i ? '<span class="sep" data-on="' + (i <= 3 ? 1 : 0) + '"></span>' : '') + '<span class="rs" data-s="' + k + '"><span class="mk">' + (k === 'done' ? CHECK : '') + '</span>' + s + '</span>';
  }).join('') + '<span class="railEnd"><span class="abort"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>준비 중단</span><span><svg class="i" viewBox="0 0 24 24"><path d="M13 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 16l-4-4 4-4"/><path d="M5 12h10"/></svg>앱 끄기</span></span>';

  function fit() { app.style.setProperty('--s', document.querySelector('.frame').clientWidth / 1920); }
  fit(); if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body); else window.addEventListener('resize', fit);
  reset();
})();
</script>
<!-- Codex 비교안: 세부 과정의 맥락, 보조 수치, 시험 사진 확대. 원본 모의 장비 흐름 유지. -->
<style>
.detailTrail { position:absolute; left:560px; right:100px; top:100px; display:flex; align-items:center; gap:22px; min-height:44px; opacity:0; color:var(--muted); font-size:18px; }
.app[data-ready="1"] .detailTrail { opacity:1; }
.detailTrail span { display:flex; align-items:center; gap:10px; }
.detailTrail b { display:grid; place-items:center; width:28px; height:28px; border:1px solid var(--line); border-radius:50%; font-size:14px; font-weight:500; }
.detailTrail [aria-current="step"] { color:var(--accent); }
.detailTrail [aria-current="step"] b { border-color:var(--accent); }
.detailTrail .done { color:var(--text); }
.detailTrail .done b { color:var(--pass); border-color:var(--step-done-line); }
.app[data-step="극축 정렬"] .liveHead .num { font-size:25px; color:var(--muted); }
.app[data-step="시험 사진"] .live { left:530px; width:780px; height:690px; }
.app[data-step="시험 사진"] .panel { left:1370px; width:450px; }
.app[data-step="시험 사진"] .panel h2 { font-size:34px; }
.app[data-step="시험 사진"] .panel p { font-size:19px; }
.app[data-step="시험 사진"] .liveHead .num { font-size:25px; color:var(--muted); }
.app[data-step="시험 사진"] .liveHead .num small { font-size:18px; }
.photoExpand { position:absolute; right:16px; bottom:16px; z-index:2; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 18px; font:inherit; cursor:pointer; }
.photoView { position:absolute; inset:44px 0 38px; z-index:20; background:var(--bg); padding:32px 56px; display:grid; grid-template-rows:54px 1fr 36px; gap:16px; }
.photoView[hidden] { display:none; }
.photoView header { display:flex; align-items:center; justify-content:space-between; font-size:23px; }
.photoView button { background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 20px; font:inherit; cursor:pointer; }
.photoView .image { min-height:0; display:grid; place-items:center; overflow:hidden; background:var(--surface); border-radius:14px; }
.photoView svg { width:100%; height:100%; }
.photoView .star { fill:var(--text); }
.photoView footer { color:var(--muted); font-size:17px; }
</style>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app'), stage = document.getElementById('stage');
  var trail = document.createElement('nav'); trail.className='detailTrail'; trail.setAttribute('aria-label','현재 단계의 세부 과정'); stage.appendChild(trail);
  var viewer = document.createElement('section'); viewer.className='photoView'; viewer.hidden=true; viewer.setAttribute('role','dialog'); viewer.setAttribute('aria-modal','true'); viewer.setAttribute('aria-label','시험 사진 크게 보기');
  viewer.innerHTML='<header><span>시험 사진 · M31 · 120초 · ISO 800</span><button type="button">닫기 · Esc</button></header><div class="image"></div><footer>시뮬레이션 이미지 · 화면에 맞춰 확대합니다. 실제 사진의 원본 픽셀 확대는 앱 구현에서 연결합니다.</footer>';
  app.appendChild(viewer);
  var previousFocus;
  function close() { viewer.hidden=true; Array.from(app.children).forEach(function(el){ if(el!==viewer) el.inert=false; }); if(previousFocus && previousFocus.isConnected) previousFocus.focus(); }
  viewer.querySelector('button').onclick=close;
  viewer.addEventListener('keydown',function(e){ if(e.key==='Escape'){e.preventDefault();close();} if(e.key==='Tab'){e.preventDefault();viewer.querySelector('button').focus();} });
  function refresh() {
    var step=document.getElementById('stepNameB').textContent;
    app.dataset.step=step;
    var kicker=document.getElementById('kicker').textContent;
    var names=step==='극축 정렬'?['SharpCap 실행','정렬 확인','PHD2 재연결']:step==='가이딩'?['별 선택','캘리브레이션','안정화','측정·판정']:[];
    var m=kicker.match(/^(\d+)\s*\//), active=m?Number(m[1])-1:0;
    var markup=names.map(function(n,i){ return '<span'+(i===active?' aria-current="step"':'')+(i<active?' class="done"':'')+'><b>'+(i<active?'✓':i+1)+'</b>'+n+'</span>'; }).join('');
    if(trail.innerHTML!==markup) trail.innerHTML=markup;
    var body=document.getElementById('liveBody');
    var ready=step==='시험 사진' && !!body.querySelector('ellipse');
    var expand=body.querySelector('.photoExpand');
    if(ready && !expand){
      expand=document.createElement('button'); expand.type='button'; expand.className='photoExpand'; expand.textContent='사진 크게 보기';
      expand.onclick=function(){
        var svg=body.querySelector('svg'); if(!svg)return;
        viewer.querySelector('.image').replaceChildren(svg.cloneNode(true));
        previousFocus=document.activeElement; viewer.hidden=false;
        Array.from(app.children).forEach(function(el){ if(el!==viewer) el.inert=true; }); viewer.querySelector('button').focus();
      };
      body.appendChild(expand);
    }
    if(!ready && !viewer.hidden)close();
  }
  var observer=new MutationObserver(refresh);
  ['stepNameB','kicker','liveBody'].forEach(function(id){observer.observe(document.getElementById(id),{childList:true,subtree:true,characterData:true});});
  document.querySelector('.top h1').textContent='촬영 준비 · Codex 비교안';
  document.querySelector('.top p').textContent='원호와 6단계 흐름을 유지하고 세부 과정 표시·시험 사진 크기·보조 수치의 비중을 조정했습니다. 모의 시안이며 실제 장비는 움직이지 않습니다.';
  refresh();
})();
</script>
