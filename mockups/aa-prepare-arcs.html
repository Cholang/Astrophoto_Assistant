<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AA 촬영 준비 원호 시안</title>
<!--
  촬영 준비 1~7단계 시안 (Claude, 2026-10-02 개정). Codex 원호 시안(aa-prepare-edge-arcs-codex.html)의 스타일을 따른다.
  - "촬영을 준비합니다" 원이 커지며 왼쪽 가장자리의 원호 조각 7개가 된다 (항성계 비유: "준비" 행성의 궤도와 위성)
  - 원호는 화면 왼쪽으로 붙여(가장 오른쪽 x≈210) 가운데·오른쪽 공간을 넓힌다
  - 가운데: 지금 단계의 실시간 화면 + 핵심 수치 하나. 오른쪽: 단계 안 진행(한 곳에만) · 제목 · 설명 · 버튼
  - 단계 끝은 모두 사용자가 누른다. 끝내는 버튼이 다음 단계를 시작한다 (DESIGN.md "촬영 준비")
  - 7단계: 극축 정렬 · 캘리브레이션 · 대상 이동 · 초점 · 센터링 · 가이딩 · 시험 사진 (Codex 리뷰 CX-PREP-FLOW-01)
  - 모의 시안: 장비는 움직이지 않는다. 시간은 짧게 줄였다
-->
<style>
:root {
  --page-bg: #17181a; --page-surface: #202124; --page-text: #e8e5df; --page-muted: #9d9a94; --page-line: #34363a; --page-accent: #f0a93b;
  --font: 'Pretendard Variable', Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--page-text); font-family: var(--font); font-size: 15px; line-height: 1.6; word-break: keep-all; }
.page { max-width: 1760px; margin: 0 auto; padding: 24px 20px 56px; display: grid; gap: 16px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 800; }
.top p { margin: 4px 0 0; color: var(--page-muted); font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.controls .lbl { font-size: 13px; color: var(--page-muted); margin-left: 8px; }
.ctl { padding: 5px 12px; border: 1px solid var(--page-line); border-radius: 8px; background: var(--page-surface); color: var(--page-text); font: inherit; font-size: 13px; cursor: pointer; }
.ctl[aria-pressed="true"] { border-color: var(--page-accent); color: var(--page-accent); font-weight: 700; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid var(--page-line); border-radius: 12px; }

/* ───────── 앱 (1920×1200 기준, 폭에 맞춰 축소) ───────── */
.app { position: absolute; left: 0; top: 0; width: 1920px; height: 1200px; transform-origin: 0 0; transform: scale(var(--s, 1));
  display: flex; flex-direction: column; font-family: var(--font); font-size: 15.5px; line-height: 1.6; color: var(--text); background: var(--bg); overflow: hidden;
  --radius: 10px; --gutter: 96px; }
.app, .app[data-t="dark"] { --bg:#1e1f21; --surface:#27292c; --surface-2:#303236; --line:#3b3e42; --text:#ebe8e3; --muted:#a3a09a; --accent:#f0a93b; --pass:#72bf8e; --fail:#f07a52; --warn:#f0a93b; --step-done-line:#5e8f6f; --primary-bg:#f0a93b; --primary-border:#f0a93b; --primary-text:#231800; --glow: rgb(240 169 59 / .55); }
.app[data-t="light"] { --bg:#f1f1ef; --surface:#fafaf9; --surface-2:#e7e7e4; --line:#d6d6d2; --text:#25272a; --muted:#676a6e; --accent:#b36b00; --pass:#2f7d4e; --fail:#c24a26; --warn:#a06200; --step-done-line:#8fb89d; --primary-bg:#b36b00; --primary-border:#b36b00; --primary-text:#fff; --glow: rgb(179 107 0 / .4); }
.app[data-t="night"] { --bg:#000; --surface:#0c0000; --surface-2:#170000; --line:#3c0000; --text:#b80000; --muted:#720000; --accent:#d00000; --pass:#b80000; --fail:#b80000; --warn:#b80000; --step-done-line:#6a0000; --primary-bg:#260000; --primary-border:#8a0000; --primary-text:#d00000; --glow: rgb(208 0 0 / .4); }
.app svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 상태 줄 */
.bar { flex: 0 0 44px; display: flex; align-items: center; gap: 20px; padding: 0 var(--gutter); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; position: relative; z-index: 5; background: var(--bg); }
.bar .brand { font-weight: 800; letter-spacing: .04em; color: var(--text); }
.bar .ver { margin-left: -12px; font-size: 11px; }
.bar .prof { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; }
.bar .ava { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); }
.bar .devs { display: flex; gap: 14px; flex: 1; }
.bar .dev { display: inline-flex; align-items: center; gap: 6px; }
.bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); }
.bar .dev[data-busy="1"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.bar .site { color: var(--text); } .bar .site b { font-weight: 600; margin-right: 6px; }
.bar .clock { color: var(--text); }

/* 단계 레일 */
.rail { flex: 0 0 38px; position: relative; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); background: var(--bg); }
.rail .rs { display: inline-flex; align-items: center; gap: 6px; }
.rail .mk { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
.rail .rs[data-s="done"] { color: var(--text); } .rail .rs[data-s="done"] .mk { box-shadow: none; color: var(--pass); font-size: 14px; }
.rail .rs[data-s="now"] { color: var(--text); font-weight: 700; } .rail .rs[data-s="now"] .mk { box-shadow: inset 0 0 0 1.5px var(--accent); }
.rail .rs[data-s="now"] .mk::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.rail .sep { width: 28px; height: 2px; border-radius: 1px; background: var(--line); } .rail .sep[data-on="1"] { background: var(--accent); }
.railEnd { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
.railEnd span { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.railEnd .abort { box-shadow: inset 0 0 0 1px var(--line); color: var(--text); font-weight: 600; }

/* ── 무대 ── */
.stage { position: relative; flex: 1; overflow: hidden; background: var(--bg); transition: background 1200ms; }
.app[data-edge="open"] .stage { background: color-mix(in srgb, var(--bg) 96%, var(--text) 4%); }
.edgeCanvas { position: absolute; inset: 0; width: 1920px; height: 1118px; pointer-events: none; }
.edgeShape { transform: translate(960px, 559px) scale(.065); transition: transform 1600ms cubic-bezier(.65, 0, .2, 1); }
.app[data-edge="open"] .edgeShape { transform: translate(var(--ox), 559px) scale(1); }
.fullOrbit { fill: var(--bg); stroke: var(--accent); stroke-width: 22; transition: stroke 1200ms, stroke-width 1200ms; }
.app[data-edge="open"] .fullOrbit { stroke: color-mix(in srgb, var(--accent) 28%, var(--line)); stroke-width: 2; }
.seg { fill: none; stroke: var(--line); stroke-width: 24; stroke-linecap: round; opacity: 0; transition: opacity 700ms 500ms, stroke 400ms, filter 400ms; }
.app[data-edge="open"] .seg { opacity: .6; }
.app[data-edge="open"] .seg[data-s="done"] { stroke: var(--step-done-line); opacity: 1; }
.app[data-edge="open"] .seg[data-s="now"] { stroke: var(--accent); opacity: 1; filter: drop-shadow(0 0 7px var(--glow)); }
.introWords { position: absolute; left: 0; right: 0; top: 530px; text-align: center; font-size: 30px; font-weight: 600; transition: opacity 300ms; }
.app[data-edge="open"] .introWords { opacity: 0; }

/* 지금 단계 이름: 지금 조각 바로 옆, 조각을 따라 내려간다 */
.stepName { position: absolute; left: 250px; display: grid; gap: 2px; opacity: 0; transition: top 600ms cubic-bezier(.55, 0, .2, 1), opacity 400ms; }
.app[data-ready="1"] .stepName { opacity: 1; }
.stepName b { font-size: 26px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.stepName span { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 끝난 조각을 가리키면: 이름 · 결과 한 줄 */
.segHit { position: absolute; width: 56px; height: 96px; transform: translate(-50%, -50%); }
.segTip { position: absolute; transform: translateY(-50%); padding: 6px 12px; border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity 160ms; pointer-events: none; z-index: 3; }
.segTip small { color: var(--muted); margin-left: 8px; }
.segTip[data-on="1"] { opacity: 1; }

/* 가운데: 실시간 화면 (원호를 왼쪽으로 붙여 넓어짐) */
.live { position: absolute; left: 430px; top: 559px; width: 720px; height: 620px; transform: translateY(-50%); display: grid; grid-template-rows: 64px 1fr; gap: 14px; opacity: 0; transition: opacity 400ms; }
.app[data-ready="1"] .live { opacity: 1; }
.liveHead { display: flex; align-items: baseline; justify-content: space-between; }
.liveHead .num { font-size: 52px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.liveHead .num small { font-size: 20px; font-weight: 600; color: var(--muted); margin-left: 6px; }
/* 목표를 향해 가는 숫자가 아닌 것(경과 시간·별 수)은 작고 흐리게 (Codex 리뷰 CX-PREP-UI-03) */
.liveHead .num[data-weak="1"] { font-size: 28px; color: var(--muted); }
.liveHead .num[data-weak="1"] small { font-size: 16px; }
.liveHead .cap { font-size: 15px; color: var(--muted); text-align: right; }
.liveBody { position: relative; border-radius: 14px; background: var(--surface); overflow: hidden; }
.liveBody svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.liveBody .grid { stroke: var(--line); stroke-width: 1; fill: none; }
.liveBody .acc { stroke: var(--accent); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.liveBody .sub2 { stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.liveBody .accFill { fill: var(--accent); }
.star { fill: var(--text); }
.liveBody text { font-family: var(--font); font-size: 15px; fill: var(--muted); }
.readout { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; }
.readout .rows { display: grid; gap: 14px; font-size: 20px; }
.readout .rows div { display: flex; gap: 24px; justify-content: space-between; min-width: 380px; }
.readout .rows span { color: var(--muted); }
.readout .rows b { font-weight: 600; }
.readout .rows b[data-k="busy"] { color: var(--accent); } .readout .rows b[data-k="ok"] { color: var(--pass); } .readout .rows b[data-k="fail"] { color: var(--fail); }
.expand { position: absolute; right: 14px; bottom: 14px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; font-size: 15px; cursor: pointer; }
.viewer { position: absolute; inset: 0; z-index: 10; display: grid; grid-template-rows: 56px 1fr; gap: 12px; padding: 24px 56px 32px; background: var(--bg); }
.viewer[hidden] { display: none; }
.viewer header { display: flex; align-items: center; justify-content: space-between; font-size: 22px; }
.viewer header button { padding: 8px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
.viewer .img { position: relative; border-radius: 14px; background: var(--surface); overflow: hidden; }
.viewer .img svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* 오른쪽: 할 일. 단계 안 진행은 맨 위 한 곳에만 (점 + 지금 과정 이름, 또는 "7 / 9 지점") */
.panel { position: absolute; left: 1230px; top: 559px; width: 600px; transform: translateY(-50%); display: grid; gap: 22px; justify-items: start; opacity: 0; transition: opacity 300ms; }
.app[data-ready="1"] .panel { opacity: 1; }
.panel[data-swap="1"] { opacity: 0 !important; }
.inner { display: flex; align-items: center; gap: 12px; min-height: 29px; font-size: 18px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.pips { display: inline-flex; gap: 8px; }
.pips i { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
.pips i[data-s="done"] { background: var(--pass); box-shadow: none; }
.pips i[data-s="now"] { box-shadow: inset 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 30%, transparent); }
.panel h2 { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.35; text-wrap: balance; }
.panel p { margin: 0; font-size: 21px; color: var(--muted); line-height: 1.75; min-height: calc(2 * 1.75em); }
.status { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; min-height: 34px; }
.status[data-k="ok"] { color: var(--pass); } .status[data-k="fail"] { color: var(--fail); } .status[data-k="warn"] { color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; min-height: 64px; }
.primary { display: inline-flex; align-items: center; justify-content: center; min-width: 220px; height: 64px; padding: 0 28px; border: 1.5px solid var(--primary-border); border-radius: 14px; background: var(--primary-bg); color: var(--primary-text); font: inherit; font-size: 21px; font-weight: 800; cursor: pointer; }
.quiet { height: 64px; padding: 0 22px; border: 1.5px solid var(--line); border-radius: 14px; background: transparent; color: var(--text); font: inherit; font-size: 18px; font-weight: 600; cursor: pointer; }
.app button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.mini { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes jitter { 0%,100% { transform: translate(0,0); } 25% { transform: translate(1.2px,-.8px); } 50% { transform: translate(-.8px,.6px); } 75% { transform: translate(.6px,1px); } }
@media (prefers-reduced-motion: reduce) { .edgeShape, .seg, .stepName, .live, .panel { transition-duration: 1ms !important; transition-delay: 0ms !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>촬영 준비 · 원호 시안 (1~7단계)</h1>
    <p>Codex 원호 시안의 스타일을 따른 전체 흐름 시안입니다. 단계 끝은 모두 버튼으로 넘어가고, 그 버튼이 다음 단계를 시작합니다. 장비는 움직이지 않으며 시간은 줄였습니다.</p>
  </header>
  <div class="controls">
    <button class="ctl" id="replay" type="button">처음부터</button>
    <span class="lbl">단계로 바로</span>
    <span id="jump"></span>
  </div>
  <div class="controls">
    <span class="lbl" style="margin-left:0">경우</span>
    <button class="ctl" id="failT" type="button" aria-pressed="false">다음 동작 실패</button>
    <button class="ctl" id="lowT" type="button" aria-pressed="false">대상이 아직 낮음</button>
    <button class="ctl" id="reuseT" type="button" aria-pressed="false">같은 밤 두 번째 대상 (캘리브레이션 재사용)</button>
    <span class="lbl">테마</span>
    <button class="ctl" data-t="dark" type="button" aria-pressed="true">어둡게</button>
    <button class="ctl" data-t="light" type="button" aria-pressed="false">밝게</button>
    <button class="ctl" data-t="night" type="button" aria-pressed="false">촬영</button>
  </div>

  <div class="frame"><div class="app" id="app" data-edge="intro" data-ready="0">
    <div class="bar"><span class="brand">AA</span><span class="ver">v0.0.31</span><span class="prof"><span class="ava"></span>별보는사람</span>
      <span class="devs"><span class="dev"><span class="dot"></span>WandererBox</span><span class="dev"><span class="dot"></span>OnStep</span><span class="dev"><span class="dot"></span>Pleiades68</span><span class="dev"><span class="dot"></span>X-T5</span><span class="dev"><span class="dot"></span>Oasis Focuser</span><span class="dev" id="phd2Dev"><span class="dot"></span><span id="phd2Txt">PHD2</span></span></span>
      <span class="site"><b>안반데기 주차장</b>위도 37.62° · 경도 128.74°</span><time class="clock">21:48</time></div>

    <div class="stage" id="stage">
      <svg class="edgeCanvas" viewBox="0 0 1920 1118" aria-hidden="true"><g class="edgeShape" id="edgeShape"><circle class="fullOrbit" cx="0" cy="0" r="3178"/></g></svg>
      <div class="introWords">촬영을 준비합니다</div>
      <div id="hits"></div><div class="segTip" id="segTip"></div>
      <div class="stepName" id="stepName"><b id="stepNameB"></b><span id="stepNameN"></span></div>

      <section class="live" aria-live="polite">
        <div class="liveHead"><span class="num" id="num"></span><span class="cap" id="cap"></span></div>
        <div class="liveBody" id="liveBody"></div>
      </section>

      <section class="panel" id="panel" aria-live="polite">
        <span class="inner" id="inner"></span>
        <h2 id="title"></h2>
        <p id="desc"></p>
        <span class="status" id="status"></span>
        <div class="row" id="row"></div>
      </section>

      <section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="시험 사진 크게 보기" hidden>
        <header><span>시험 사진 · M31 · 120초 · ISO 800</span><button type="button" id="viewerClose">닫기 · Esc</button></header>
        <div class="img" id="viewerImg"></div>
      </section>
    </div>

    <nav class="rail" id="rail"></nav>
  </div></div>
</div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var $ = function (id) { return document.getElementById(id); };
  var CHECK = '<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M20 6 9 17l-5-5"/></svg>';
  var WARN = '<svg class="i" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>';
  var X = '<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  var STEPS = ['극축 정렬', '캘리브레이션', '대상 이동', '초점', '센터링', '가이딩', '시험 사진'];
  var N = STEPS.length;
  var TARGET = 'M31 안드로메다';
  var EXPOSURE = 120;
  var VW = 720, VH = 542; // 가운데 화면 그림 좌표 (live 본문 크기)

  // ── 원호: 중심 (OX, 559), 반지름 3200. 가장 오른쪽 x = OX + 3200 ≈ 210 (화면 왼쪽에 붙임) ──
  var OX = -2990, R = 3200, SPAN = 7.22, GAP = 0.5;
  app.style.setProperty('--ox', OX + 'px');
  var segLen = (2 * SPAN - (N - 1) * GAP) / N, segMid = [], shape = $('edgeShape');
  for (var k = 0; k < N; k++) {
    var a0 = -SPAN + k * (segLen + GAP), a1 = a0 + segLen, mid = (a0 + a1) / 2, d = Math.PI / 180;
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('class', 'seg');
    p.setAttribute('d', 'M ' + (R * Math.cos(a0 * d)).toFixed(3) + ' ' + (R * Math.sin(a0 * d)).toFixed(3) + ' A ' + R + ' ' + R + ' 0 0 1 ' + (R * Math.cos(a1 * d)).toFixed(3) + ' ' + (R * Math.sin(a1 * d)).toFixed(3));
    shape.appendChild(p);
    segMid.push({ x: OX + R * Math.cos(mid * d), y: 559 + R * Math.sin(mid * d) });
  }
  var segs = Array.prototype.slice.call(document.querySelectorAll('.seg'));

  // ── 상태 ──
  var cur = 0, segState = [], results = [];
  var timers = [], ivals = [];
  var failNext = false, targetLow = false, reuseCal = false;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function every(fn, ms) { var h = setInterval(fn, ms); ivals.push(h); return h; }
  function clearAll() { timers.forEach(clearTimeout); ivals.forEach(clearInterval); timers = []; ivals = []; }

      if (fit) {
        var dd = '';
        for (var t = 0; t <= 40; t++) { var p = POS[0] + (POS[8] - POS[0]) * t / 40, h = 2.05 + Math.pow((p - best) / 520, 2) * .55; dd += (t ? 'L' : 'M') + (X0 + (X1 - X0) * (p - POS[0]) / (POS[8] - POS[0])).toFixed(1) + ',' + py(h).toFixed(1); }
        var bx = X0 + (X1 - X0) * (best - POS[0]) / (POS[8] - POS[0]);
        s += '<path class="acc" d="' + dd + '" opacity=".8"/><line class="acc" x1="' + bx + '" y1="' + Y0 + '" x2="' + bx + '" y2="' + py(2.05) + '" stroke-dasharray="3 5"/><text x="' + bx + '" y="' + (Y0 + 30) + '" text-anchor="middle" style="fill:var(--accent)">12,340</text>';
      }
      for (var i = 0; i < n; i++) s += '<circle cx="' + px(i) + '" cy="' + py(HFR[i]) + '" r="6" class="' + (i === n - 1 && !fit ? 'accFill' : 'star') + '"/>';
      body(svg(s));
    }
    head(null, '', '별 크기 (HFR)');
    draw(0, false);
    setPanel({ inner: '0 / 9 지점', title: '초점을 맞추고 있습니다', desc: '포커서를 조금씩 옮기며 별 크기를 잽니다. 가장 작아지는 위치를 찾습니다.', status: { k: 'busy', t: '자동초점 중입니다' } });
    var n = 0;
    every(function () {
      if (n >= 9) return;
      n++;
      setInner(n + ' / 9 지점');
      head(HFR[n - 1].toFixed(1), '', '별 크기 (HFR) · 이번 지점');
      draw(n, false);
      if (fail && n === 4) {
        n = 99;
        setPanel({ inner: '4 / 9 지점', title: '자동초점을 마치지 못했습니다', desc: '별을 충분히 찾지 못했습니다. 구름이 지나가는 중이거나 초점이 많이 나가 있을 수 있습니다.',
          status: { k: 'fail', t: '자동초점에서 별을 찾지 못했습니다' },
          buttons: [{ label: '다시 시도', primary: true, onClick: function () { goto(3); } }, { label: '손으로 맞췄어요', onClick: function () { finishStep('직접 맞춤'); next(); } }] });
        return;
      }
      if (n === 9) later(function () {
        draw(9, true); head('2.1', '', '별 크기 (HFR) · 가장 좋은 위치');
        endStep({ result: 'HFR 2.1 · 위치 12,340', inner: '9 / 9 지점', title: '초점을 맞췄습니다', desc: '포커서를 12,340 위치로 옮겼습니다. 다음은 사진을 찍어 대상을 화면 가운데로 맞춥니다.', ok: '별 크기 HFR 2.1', nextLabel: '센터링 시작' });
      }, 500);
    }, 520);
  };

  // ───────── ⑤ 센터링: 솔빙 사진 위 대상 위치가 가운데로 ─────────
  RUN[4] = function () {
    var fail = takeFail();
    var offs = [{ x: 160, y: -100, e: 12.4 }, { x: 26, y: -16, e: 2.1 }, { x: 4, y: -2, e: 0.4 }];
    function shot(o, solving) {
      var cx = VW / 2 + o.x, cy = VH / 2 + o.y;
      body(svg(starfield(VW, VH, 340, 31 + Math.round(o.x), 1) + galaxy(cx, cy, 1.2) +
        '<line class="sub2" x1="' + (VW / 2 - 24) + '" y1="' + (VH / 2) + '" x2="' + (VW / 2 + 24) + '" y2="' + (VH / 2) + '"/><line class="sub2" x1="' + (VW / 2) + '" y1="' + (VH / 2 - 24) + '" x2="' + (VW / 2) + '" y2="' + (VH / 2 + 24) + '"/>' +
        '<circle class="acc" cx="' + cx + '" cy="' + cy + '" r="26"/>' +
        '<text x="16" y="' + (VH - 16) + '">' + (solving ? '사진에서 위치를 계산하는 중…' : '+ 화면 가운데 · ○ 대상 M31') + '</text>', true));
    }
    head(null, '', '대상과 화면 가운데의 거리');
    body('');
    setPanel({ inner: '1회차', title: '대상을 화면 가운데로 맞추고 있습니다', desc: '사진을 찍어 실제 위치를 계산하고, 적도의를 조금씩 옮깁니다. 카메라 방향은 그대로 둡니다.', status: { k: 'busy', t: '사진을 찍는 중입니다' } });
    var i = 0;
    function iter() {
      var o = offs[i];
      setInner((i + 1) + '회차');
      status({ k: 'busy', t: '사진에서 위치를 계산하는 중입니다' });
      shot(o, true);
      later(function () {
        if (fail && i === 0) {
          setPanel({ inner: '1회차', title: '위치를 계산하지 못했습니다', desc: '사진에서 별 배치를 찾지 못했습니다 (솔빙 실패). 구름이나 초점 문제일 수 있습니다.', status: { k: 'fail', t: '센터링에 실패했습니다' },
            buttons: [{ label: '다시 시도', primary: true, onClick: function () { goto(4); } }, { label: '초점 다시 맞추기', onClick: function () { goto(3); } }] });
          return;
        }
        shot(o, false); head(o.e.toFixed(1), '′', '대상과 화면 가운데의 거리');
        i++;
        if (i < offs.length) { status({ k: 'busy', t: '적도의를 조금 옮기는 중입니다' }); later(iter, 900); }
        else endStep({ result: '오차 0.4′ · 카메라 방향 87°', inner: '3회차', title: '대상을 가운데로 맞췄습니다', desc: '오차 0.4′, 지금 카메라 방향은 87°입니다. 다음은 가이딩을 시작합니다.', ok: '센터링을 마쳤습니다', nextLabel: '가이딩 시작' });
      }, 1300);
    }
    later(iter, 500);
  };

  // ───────── ⑥ 가이딩: 별 선택 → 안정화 → 측정 (캘리브레이션은 ②에서 끝남) ─────────
  var GUIDE = ['별 선택', '안정화', '측정'];
  RUN[5] = function () {
    var fail = takeFail();
    var ra = [], de = [], r = rng(7), tick = 0, phase = 0, star = false;
    function view() {
      var gx0 = 40, gx1 = 680, gy = 400, gh = 120, n = 70, s = '';
      s += '<rect x="250" y="24" width="220" height="200" rx="10" fill="var(--bg)"/>';
      if (star) s += '<g style="animation:jitter 1.4s steps(4) infinite"><circle cx="360" cy="124" r="30" class="star" opacity=".12"/><circle cx="360" cy="124" r="15" class="star" opacity=".35"/><circle cx="360" cy="124" r="6" class="star"/></g>' +
        '<rect x="326" y="90" width="68" height="68" rx="4" fill="none" style="stroke:var(--pass);stroke-width:2"/>';
      else s += '<text x="360" y="130" text-anchor="middle">별을 찾는 중</text>';
      s += '<text x="360" y="248" text-anchor="middle">가이드 별 (PHD2)</text>';
      s += '<line class="grid" x1="' + gx0 + '" y1="' + gy + '" x2="' + gx1 + '" y2="' + gy + '"/><line class="grid" x1="' + gx0 + '" y1="' + (gy - gh / 2) + '" x2="' + gx1 + '" y2="' + (gy - gh / 2) + '" stroke-dasharray="3 6"/><line class="grid" x1="' + gx0 + '" y1="' + (gy + gh / 2) + '" x2="' + gx1 + '" y2="' + (gy + gh / 2) + '" stroke-dasharray="3 6"/>';
      function line(arr, cls) { if (arr.length < 2) return ''; var dd = ''; var st = Math.max(0, arr.length - n); for (var i = st; i < arr.length; i++) dd += (i === st ? 'M' : 'L') + (gx0 + (gx1 - gx0) * (i - st) / (n - 1)).toFixed(1) + ',' + (gy - arr[i] * gh / 2 / 2.4).toFixed(1); return '<path class="' + cls + '" d="' + dd + '"/>'; }
      s += line(de, 'sub2') + line(ra, 'acc');
      s += '<text x="' + gx0 + '" y="' + (gy + gh / 2 + 34) + '">— 적경</text><text x="' + (gx0 + 90) + '" y="' + (gy + gh / 2 + 34) + '">— 적위</text><text x="' + gx1 + '" y="' + (gy - gh / 2 - 8) + '" text-anchor="end">±2.4″ (주 카메라 한 픽셀)</text>';
      body(svg(s));
    }
    function rms(a) { if (!a.length) return 0; var s = 0; a.forEach(function (v) { s += v * v; }); return Math.sqrt(s / a.length); }
    head(null, '', '가이딩 오차 (전체)');
    setPanel({ inner: { names: GUIDE, at: 0 }, title: '가이딩을 시작합니다', desc: '가이드 별을 따라 적도의를 미세하게 보정합니다. 안정되면 오차를 재어 보여 드립니다.', status: { k: 'busy', t: '가이드 별을 고르는 중입니다' } });
    view();
    every(function () {
      tick++;
      if (tick === 6) {
        if (fail) {
          clearAll();
          setPanel({ inner: { names: GUIDE, at: 0 }, title: '가이드 별을 찾지 못했습니다', desc: '가이드 카메라에 별이 보이지 않습니다. 가이드 망원경 덮개나 초점을 확인한 뒤 다시 시도해 주세요.',
            status: { k: 'fail', t: '별 없음' }, buttons: [{ label: '다시 시도', primary: true, onClick: function () { goto(5); } }, { label: 'PHD2 화면 열기', onClick: function () {} }] });
          return;
        }
        star = true; phase = 1; setInner({ names: GUIDE, at: 1 }); status({ k: 'busy', t: '가이딩이 안정되기를 기다리는 중입니다' });
      }
      if (tick === 18) { phase = 2; setInner({ names: GUIDE, at: 2 }); status({ k: 'busy', t: '가이딩 오차를 재는 중입니다' }); }
      if (phase >= 1) {
        var amp = phase === 1 ? 1.6 - (tick - 6) * .07 : .75;
        ra.push((r() - .5) * 2 * amp); de.push((r() - .5) * 2 * amp * .8);
        if (phase === 2) head(Math.sqrt(rms(ra.slice(-28)) * rms(ra.slice(-28)) + rms(de.slice(-28)) * rms(de.slice(-28))).toFixed(1), '″', '가이딩 오차 (전체) · 기준 2.4″');
      }
      view();
      if (tick === 50) {
        clearAll();
        var mra = ra.slice(-28), mde = de.slice(-28);
        var tot = Math.sqrt(rms(mra) * rms(mra) + rms(mde) * rms(mde));
        head(tot.toFixed(1), '″', '가이딩 오차 (전체) · 기준 2.4″');
        setPanel({ inner: { names: GUIDE, at: 2, all: true }, title: '충분해요', desc: '가이딩 오차 ' + tot.toFixed(1) + '″로 주 카메라 한 픽셀(2.4″)보다 작습니다. 사진에서 흔들림이 거의 보이지 않을 수준이에요.',
          status: { k: 'ok', t: '적경 ' + rms(mra).toFixed(1) + '″ · 적위 ' + rms(mde).toFixed(1) + '″ · 별 잃음 없음' },
          buttons: [{ label: '시험 사진 찍기', primary: true, onClick: function () { finishStep(tot.toFixed(1) + '″ · 충분'); next(); } }, { label: '다시 재기', onClick: function () { goto(5); } }] });
      }
    }, 160);
  };

  // ───────── ⑦ 시험 사진 → "촬영 시작" ─────────
  RUN[6] = function () {
    var fail = takeFail(), left = EXPOSURE, photo = '';
    head(left, '초', '남은 노출');
    body(svg('<text x="' + VW / 2 + '" y="' + VH / 2 + '" text-anchor="middle">노출 중</text>'));
    setPanel({ inner: '120초 · ISO 800', title: '시험 사진을 찍고 있습니다', desc: '계획한 노출 그대로 한 장 찍어 초점·추적·구도를 확인합니다.', status: { k: 'busy', t: '노출 중입니다' } });
    every(function () {
      if (left <= 0) return;
      left = Math.max(0, left - 8);
      head(left, '초', '남은 노출 (시안은 15배 빠르게)');
      if (left === 0) {
        clearAll();
        if (fail) {
          setPanel({ inner: '120초 · ISO 800', title: '사진을 받지 못했습니다', desc: '카메라에서 사진을 내려받지 못했습니다. 카메라 연결을 확인한 뒤 다시 찍어 주세요.', status: { k: 'fail', t: '시험 사진을 찍지 못했습니다' },
            buttons: [{ label: '다시 찍기', primary: true, onClick: function () { goto(6); } }] });
          return;
        }
        photo = starfield(VW, VH, 520, 99, 1.15) + galaxy(VW / 2 + 4, VH / 2 - 2, 1.8);
        body(svg(photo, true) + '<button type="button" class="expand" id="expand">크게 보기</button>');
        $('expand').onclick = function () { $('viewerImg').innerHTML = svg(photo, false); $('viewer').hidden = false; $('viewerClose').focus(); };
        head('312', '개', '별 수 · 별 크기 HFR 2.3', true);
        setPanel({ inner: '120초 · ISO 800', title: '시험 사진을 확인해 주세요', desc: '별이 둥글고 대상이 가운데에 있으면 촬영을 시작하세요. 끝나는 시각은 04:58입니다.', status: { k: 'ok', t: '별 312개 · 별 크기 HFR 2.3' },
          buttons: [{ label: '촬영 시작', primary: true, onClick: function () { finishStep('별 312개 · HFR 2.3'); setPanel({ title: '촬영을 시작합니다', desc: '(시안 끝) 다음 화면은 촬영 단계입니다.', status: { k: 'ok', t: '준비를 마쳤습니다' }, buttons: [{ label: '처음부터 다시 보기', primary: true, onClick: reset }] }); } },
            { label: '다시 찍기', onClick: function () { goto(6); } }, { label: '다시 센터링', onClick: function () { goto(4); } }] });
      }
    }, 70);
  };
  $('viewerClose').onclick = function () { $('viewer').hidden = true; };
  $('viewer').addEventListener('keydown', function (e) { if (e.key === 'Escape') $('viewer').hidden = true; });

  // ── 끝난 조각을 가리키면 이름 · 결과 ──
  $('hits').innerHTML = segMid.map(function (m, i) { return '<span class="segHit" data-i="' + i + '" style="left:' + m.x + 'px;top:' + m.y + 'px"></span>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.segHit'), function (h) {
    h.addEventListener('mouseenter', function () {
      var i = +h.dataset.i; if (segState[i] !== 'done') return;
      var tip = $('segTip'); tip.innerHTML = STEPS[i] + '<small>' + results[i] + '</small>';
      tip.style.left = (segMid[i].x + 36) + 'px'; tip.style.top = segMid[i].y + 'px'; tip.dataset.on = '1';
    });
    h.addEventListener('mouseleave', function () { $('segTip').dataset.on = '0'; });
  });

  // ── 시작 ──
  var PRESET = ['사용자 확인 · 12분', '직교 오차 1.2°', '고도 42° · 방위 64°', 'HFR 2.1 · 위치 12,340', '오차 0.4′ · 카메라 방향 87°', '0.9″ · 충분'];
  function reset() {
    clearAll(); cur = 0; segState = []; results = [];
    for (var i = 0; i < N; i++) { segState.push(i === 0 ? 'now' : 'idle'); results.push(''); }
    $('viewer').hidden = true; phd2(false, 'PHD2'); app.dataset.edge = 'intro'; app.dataset.ready = '0'; paintSegs();
    later(function () { app.dataset.edge = 'open'; }, 1100);
    later(function () { app.dataset.ready = '1'; RUN[0](); }, 2700);
  }
  $('replay').onclick = reset;
  $('jump').innerHTML = STEPS.map(function (s, i) { return '<button class="ctl" type="button" data-j="' + i + '">' + (i + 1) + ' ' + s + '</button>'; }).join(' ');
  Array.prototype.forEach.call(document.querySelectorAll('[data-j]'), function (b) {
    b.onclick = function () { $('viewer').hidden = true; app.dataset.edge = 'open'; app.dataset.ready = '1'; phd2(false, 'PHD2'); var n = +b.dataset.j; for (var i = 0; i < n; i++) results[i] = results[i] || PRESET[i]; goto(n); };
  });
  $('failT').onclick = function () { failNext = !failNext; this.setAttribute('aria-pressed', String(failNext)); };
  $('lowT').onclick = function () { targetLow = !targetLow; this.setAttribute('aria-pressed', String(targetLow)); };
  $('reuseT').onclick = function () { reuseCal = !reuseCal; this.setAttribute('aria-pressed', String(reuseCal)); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (b) {
    b.onclick = function () { app.dataset.t = b.dataset.t; Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); }); };
  });

  var stg = ['연결', '점검', '계획', '준비', '촬영', '마무리'];
  $('rail').innerHTML = stg.map(function (s, i) {
    var k = i < 3 ? 'done' : i === 3 ? 'now' : 'todo';
    return (i ? '<span class="sep" data-on="' + (i <= 3 ? 1 : 0) + '"></span>' : '') + '<span class="rs" data-s="' + k + '"><span class="mk">' + (k === 'done' ? CHECK : '') + '</span>' + s + '</span>';
  }).join('') + '<span class="railEnd"><span class="abort"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>준비 중단</span><span><svg class="i" viewBox="0 0 24 24"><path d="M13 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 16l-4-4 4-4"/><path d="M5 12h10"/></svg>앱 끄기</span></span>';

  function fit() { app.style.setProperty('--s', document.querySelector('.frame').clientWidth / 1920); }
  fit(); if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body); else window.addEventListener('resize', fit);
  reset();
})();
</script>
</body>
</html>
